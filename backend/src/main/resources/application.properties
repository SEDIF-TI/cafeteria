# =========================================================================
# CONFIGURACION BASE — sistema_cafeteria
# =========================================================================

spring.application.name=sistema_cafeteria

# --- Conexion a PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5437}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# 'update' genera y actualiza las tablas automáticamente en la base de datos vacía.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway (Desactivado mientras se genera la estructura inicial por Hibernate) ---
spring.flyway.enabled=false

# --- Seguridad / JWT ---
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:3600000}

# --- CORS ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost,http://127.0.0.1}

# --- Paginacion ---
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# --- Rate limiting (anti fuerza bruta en /auth/login) ---
app.rate-limit.enabled=true
app.rate-limit.capacity=5
app.rate-limit.refill-minutes=1

# --- Zona horaria ---
spring.jackson.time-zone=America/Mexico_City
app.zona-horaria=America/Mexico_City

# --- Bot de Telegram ---
telegram.bot.username=${TELEGRAM_BOT_USERNAME}
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}

# --- Servidor ---
server.port=8080
server.forward-headers-strategy=framework

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never