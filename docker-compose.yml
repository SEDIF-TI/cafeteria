# ===========================================================================
# Orquestacion completa: base de datos + backend (Spring Boot) + frontend (nginx)
#
#   Levantar todo:        docker compose up -d --build
#   Solo la base (dev):   docker compose up -d db-cafeteria
#
# Las variables sensibles se leen de .env (no versionado).
# ===========================================================================

services:
  db-cafeteria:
    image: postgres:17
    container_name: postgres_cafeteria
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Mexico_City
    ports:
      # Expuesto en 5437 para herramientas (DBeaver, respaldos) desde la INTRANET.
      # NO es accesible desde internet porque redes solo hace NAT del tcp 80,
      # no de este puerto. Para restringirlo aun mas por IP de origen, ver la
      # regla DOCKER-USER documentada en el README/despliegue.
      - "5437:5432"
    volumes:
      - pgdata_cafeteria:/var/lib/postgresql/data
    networks:
      - cafeteria-net

  backend:
    image: cafeteria-backend:latest
    build: ./backend
    container_name: cafeteria_backend
    restart: always
    depends_on:
      - db-cafeteria
    # Carga POSTGRES_*, APP_JWT_SECRET y MAIL_* desde .env...
    env_file: .env
    # ...pero dentro de Docker la base se alcanza por el nombre del servicio,
    # no por localhost. Estas variables tienen prioridad sobre el .env.
    environment:
      DB_HOST: db-cafeteria
      DB_PORT: 5432
      TZ: America/Mexico_City
    networks:
      - cafeteria-net
    # No se expone el 8080 al host: el frontend (nginx) lo alcanza por la red interna.

  frontend:
    image: cafeteria-frontend:latest
    build: ./frontend
    container_name: cafeteria_frontend
    restart: always
    depends_on:
      - backend
    ports:
      # Puerto web en el host. Por defecto 8090 (para no ocupar el 80).
      # En el servidor se puede fijar WEB_PORT=80 o poner un proxy delante.
      - "${WEB_PORT:-8090}:80"
    networks:
      - cafeteria-net

  # Reverse proxy / terminacion HTTPS. Pone una sola puerta de entrada delante
  # de las apps y enruta por subdominio. En produccion saca y renueva el
  # certificado solo (ver reverse-proxy/Caddyfile).
  caddy:
    image: caddy:2-alpine
    container_name: cafeteria_caddy
    restart: always
    depends_on:
      - frontend
    ports:
      # Puerto 80 publico: redes hace NAT de tcp 80 -> esta VM, y Caddy sirve
      # la app por HTTP. En intranet tambien se alcanza por la IP de la VM.
      - "${PROXY_HTTP_PORT:-80}:80"
      # 443 se activa cuando redes entregue el dominio (SSL automatico con Caddy):
      # - "443:443"
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificados y estado de ACME (persistente)
      - caddy_config:/config
    networks:
      - cafeteria-net

volumes:
  pgdata_cafeteria:
    name: pgdata_cafeteria
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config

networks:
  cafeteria-net:
    name: cafeteria-net
