# ===========================================================================
# Orquestacion del proyecto CAFETERIA: base de datos + backend + frontend.
#
# El reverse proxy (Caddy) YA NO vive aqui: es un stack central e independiente
# (ver infra/proxy/) que atiende a TODOS los proyectos del servidor y enruta por
# subdominio. El frontend se conecta a la red compartida "proxy-net" para que
# ese Caddy central pueda alcanzarlo.
#
#   Levantar:        docker compose up -d --build
#   Solo la base:    docker compose up -d db-cafeteria
#
# Requiere que exista la red compartida (una sola vez en el servidor):
#   docker network create proxy-net
#
# Las variables sensibles se leen de .env (no versionado).
# ===========================================================================

services:
  db-cafeteria:
    image: postgres:17
    container_name: postgres_cafeteria
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Mexico_City
    ports:
      # Expuesto en 5437 para herramientas (DBeaver, respaldos) desde la INTRANET.
      # NO es accesible desde internet porque redes solo hace NAT del tcp 80,
      # no de este puerto.
      - "5437:5432"
    volumes:
      - pgdata_cafeteria:/var/lib/postgresql/data
    networks:
      - cafeteria-net

  backend:
    image: cafeteria-backend:latest
    build: ./backend
    container_name: cafeteria_backend
    restart: always
    depends_on:
      - db-cafeteria
    # Carga POSTGRES_*, APP_JWT_SECRET y MAIL_* desde .env...
    env_file: .env
    # ...pero dentro de Docker la base se alcanza por el nombre del servicio.
    # Estas variables tienen prioridad sobre el .env.
    environment:
      DB_HOST: db-cafeteria
      DB_PORT: 5432
      TZ: America/Mexico_City
    networks:
      - cafeteria-net
    # No se expone el 8080 al host: el frontend (nginx) lo alcanza por la red interna.

  frontend:
    image: cafeteria-frontend:latest
    build: ./frontend
    container_name: cafeteria_frontend
    restart: always
    depends_on:
      - backend
    ports:
      # Acceso directo opcional por IP en intranet (ej. http://IP:8090).
      # El acceso principal entra por el Caddy CENTRAL (puerto 80) via proxy-net.
      - "${WEB_PORT:-8090}:80"
    networks:
      - cafeteria-net   # para hablar con el backend
      - proxy-net       # para que el Caddy central (otro stack) lo alcance

volumes:
  pgdata_cafeteria:
    name: pgdata_cafeteria

networks:
  cafeteria-net:
    name: cafeteria-net
  # Red compartida con el proxy central. La crea el stack del proxy
  # (docker network create proxy-net), por eso va como "external".
  proxy-net:
    name: proxy-net
    external: true
