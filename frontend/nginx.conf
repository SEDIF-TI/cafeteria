# Protocolo ORIGINAL de la peticion. Cuando el HTTPS lo atiende el Caddy central,
# aqui llega por http y $scheme diria "http"; si el backend lo cree, ve distinto
# el Origin (https) del navegador y rechaza los POST con "403 Invalid CORS request".
# Por eso se respeta el X-Forwarded-Proto que manda Caddy, y solo si no viene se usa $scheme.
map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # IP REAL del cliente. Las peticiones llegan desde el Caddy central (red Docker
    # proxy-net, rango privado 172.16.0.0/12): solo a el se le cree su X-Forwarded-For.
    # Asi $remote_addr pasa a ser la IP del usuario y no la de Caddy, y nadie que
    # entre directo por el puerto 8090 puede inventarse otra IP en ese encabezado.
    # (Si "docker network inspect proxy-net" mostrara otro rango, ajustarlo aqui.)
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Comprime las respuestas de texto
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA: cualquier ruta del frontend cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reenvia las llamadas a la API hacia el backend (red interna de Docker).
    # El frontend llama a /api/v1/... y aqui se proxya al servicio "backend".
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Un solo valor ya verificado: el backend toma la IP del usuario de aqui.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $proto_original;
    }
}
