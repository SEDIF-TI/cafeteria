server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Comprime las respuestas de texto
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA: cualquier ruta del frontend cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reenvia las llamadas a la API hacia el backend (red interna de Docker).
    # El frontend llama a /api/v1/... y aqui se proxya al servicio "backend".
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
